services:
  postgres:
    image: postgres:16-alpine
    container_name: mauresto-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mauresto}
      POSTGRES_USER: ${DB_USER:-mauresto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mauresto}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mauresto_pgdata:/var/lib/postgresql/data

volumes:
  mauresto_pgdata:
